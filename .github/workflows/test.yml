name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: http-encoding-zstd-test-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"
  ZSTD_VERSION: "1.5.7"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: egao1980/http-protocol
          path: _siblings/http-protocol

      - uses: actions/checkout@v4
        with:
          repository: egao1980/cl-stack-zstd
          path: _siblings/cl-stack-zstd

      - name: Layout siblings for qlfile (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p /tmp/ws
          cp -a "$GITHUB_WORKSPACE" /tmp/ws/http-encoding-zstd
          cp -a "$GITHUB_WORKSPACE/_siblings/http-protocol" /tmp/ws/http-protocol
          cp -a "$GITHUB_WORKSPACE/_siblings/cl-stack-zstd" /tmp/ws/cl-stack-zstd

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake curl

      - name: Build zstd natives (Unix)
        if: runner.os != 'Windows'
        working-directory: /tmp/ws/cl-stack-zstd
        run: |
          chmod +x scripts/build-zstd.sh
          ./scripts/build-zstd.sh

      - name: Build zstd natives (Windows)
        if: runner.os == 'Windows'
        working-directory: _siblings/cl-stack-zstd
        shell: pwsh
        run: |
          .\scripts\build-zstd.ps1
          $lib = Resolve-Path "lib\windows-amd64"
          "Path=$lib;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell && mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Test (Unix)
        if: runner.os != 'Windows'
        working-directory: /tmp/ws/http-encoding-zstd
        shell: bash
        run: |
          ros install qlot
          qlot install
          qlot exec ros -S . -e '(asdf:test-system "http-encoding-zstd")'

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ros install rove trivial-gray-streams cffi
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/_siblings/http-protocol//:$(pwd)/_siblings/cl-stack-zstd//:"
          ros -e '(setf *debugger-hook* (lambda (c h) (declare (ignore h)) (format *error-output* "~&UNHANDLED: ~A~%" c) (uiop:quit 1)))' \
              -e '(asdf:test-system "http-encoding-zstd")' -q
